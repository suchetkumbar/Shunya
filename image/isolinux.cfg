SERIAL 0 115200
PROMPT 1
TIMEOUT 50
DEFAULT shunya
SAY
SAY Shunya live: press Enter to start, or type "serial" and Enter for a serial console.
SAY

LABEL shunya
  KERNEL /boot/vmlinuz
  INITRD /boot/initramfs.gz
  APPEND console=tty0 shunya.console=tty1 loglevel=3

LABEL serial
  KERNEL /boot/vmlinuz
  INITRD /boot/initramfs.gz
  APPEND console=tty0 console=ttyS0,115200 shunya.console=ttyS0 loglevel=4
