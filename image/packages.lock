# Alpine packages that go into the Shunya live image, pinned by version and by the
# SHA-256 of the .apk file. image/build.sh fetches each one in the lab VM and stops if a
# version or checksum differs. Alpine removes superseded versions from its mirrors, so a
# lock eventually stops resolving: run "make image-lock" (prints new lines to review and
# paste here, with the date) and rebuild.
#
# Repository: https://dl-cdn.alpinelinux.org/alpine/v3.24/main (x86_64)
# Changes are reviewed like code: the git history of this file is the record.
