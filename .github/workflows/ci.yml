name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # CI never runs lab or destructive tests: those need the `labtest` build tag, a lab token
    # and the QEMU lab VM (`make lab-test`); under -tags labtest here they report SKIPPED.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: gofmt / vet / staticcheck
        run: make lint
      - name: Unit tests (race detector)
        run: make race
      - name: Fuzz (short pass over every Fuzz* target)
        run: make fuzz FUZZTIME=5s
      - name: govulncheck
        run: make vulncheck
      - name: Build (linux dev + release, windows; static, reproducible flags)
        run: make build-linux build-release build-windows
